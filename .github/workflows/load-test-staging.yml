name: Staging Load Test

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Staging API base URL (e.g. https://api-staging.example.com/api/v1)'
        required: true
        type: string

jobs:
  browse-load-test:
    name: Browse published load test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run browse load test
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          node scripts/load-test/browse-published.js
          echo "Load test completed against $API_BASE"
